# Run from the masterenglish-api directory with the local profile.
# Override MASTERENGLISH_LOCAL_ENV if the infra repository is stored elsewhere.
spring.config.import=file:${MASTERENGLISH_LOCAL_ENV:../masterenglish-infra/.env}[.properties]

spring.datasource.url=jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:15432}/${POSTGRES_DB:masterenglish}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.address=127.0.0.1
server.port=8080
