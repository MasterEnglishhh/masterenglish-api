# Run from the masterenglish-api directory with the local profile.
# Read the API repository's own .env. Override its path with MASTERENGLISH_ENV_FILE if needed.
spring.config.import=file:${MASTERENGLISH_ENV_FILE:.env}[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${POSTGRES_DB:masterenglish}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}
