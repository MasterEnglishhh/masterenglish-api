spring.application.name=masterenglish-api

# Flyway owns the schema. Hibernate only validates entity mappings.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.modulith.events.completion-mode=update

# Health monitoring
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Discover each explicitly annotated business module under modules/.
spring.modulith.detection-strategy=explicitly-annotated
spring.mvc.problemdetails.enabled=true
