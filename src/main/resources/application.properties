spring.application.name=masterenglish-api

# Flyway owns the schema. Hibernate only validates entity mappings.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.modulith.events.completion-mode=update

# Health monitoring
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Discover each explicitly annotated business module under modules/.
spring.modulith.detection-strategy=explicitly-annotated
spring.mvc.problemdetails.enabled=true

# Reject fields that are not declared in the request DTO.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Limit nested JSON objects and arrays.
spring.jackson.factory.constraints.read.max-nesting-depth=16

# Cross-origin access is closed by default; configure exact origins through the environment.
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:true}

# JWT Configuration
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:masterenglish-api}
app.security.jwt.access-token-duration=${JWT_ACCESS_TOKEN_DURATION:15m}
app.security.rate-limit.secret=${RATE_LIMIT_SECRET:}

# Registration secrets remain on the server. No OTP is returned by an HTTP API.
app.registration.otp-secret=${OTP_HMAC_SECRET:}
app.registration.mail-enabled=${MAIL_ENABLED:false}
app.registration.from=${MAIL_FROM:}
app.registration.breach-check-enabled=${PASSWORD_BREACH_CHECK_ENABLED:true}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# SMTP delivery is checked by the send operation, not by the public health endpoint.
management.health.mail.enabled=false

# R2 is opt-in. Credentials come from the environment, never from source control.
app.storage.r2.enabled=${R2_ENABLED:false}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.region=${R2_REGION:auto}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
