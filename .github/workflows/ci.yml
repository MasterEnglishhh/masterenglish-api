name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Get source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check Docker for integration tests
        run: docker info --format '{{.ServerVersion}}'

      - name: Check formatting, run tests, and build JAR
        run: bash ./gradlew spotlessCheck check bootJar --no-daemon

      - name: Build Docker image
        run: docker build --tag masterenglish-api:ci .
